<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" aria-label="Consotelo logo" role="img">
  <defs>
    <linearGradient id="hlPersimmon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B3D" />
      <stop offset="50%" stop-color="#EF5A1D" />
      <stop offset="100%" stop-color="#C04A27" />
    </linearGradient>
    <linearGradient id="hlLilac" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9A8D8" />
      <stop offset="50%" stop-color="#C292C1" />
      <stop offset="100%" stop-color="#8E7C93" />
    </linearGradient>
    <linearGradient id="hlGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <style>
    .hl-title { font-family: 'Plus Jakarta Sans', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 32px; fill: #1F2421; letter-spacing: -0.03em; }
    .hl-c { fill: url(#hlPersimmon); }
    .hl-tagline { font-family: 'Plus Jakarta Sans', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #6B726F; letter-spacing: 0.02em; }
  </style>
  <!-- Monogram emblem on left -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="#F7F5F0" />
    <path d="M 38,18 C 44,23 44,33 37,40 C 30,47 18,45 14,37 C 11,28 16,18 25,14 C 32,11 38,14 40,18" 
          fill="none" stroke="url(#hlLilac)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 40,20 C 33,13 21,13 14,21 C 7,30 11,42 21,46 C 30,48 40,42 42,33 C 44,26 40,21 37,19" 
          fill="none" stroke="url(#hlPersimmon)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="28" r="2.8" fill="#1F2421" opacity="0.8" />
  </g>
  <!-- Wordmark on right -->
  <text x="74" y="38" class="hl-title"><tspan class="hl-c">C</tspan>onsotelo</text>
  <text x="75" y="53" class="hl-tagline">One place for every consultation</text>
</svg>
